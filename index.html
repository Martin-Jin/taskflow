<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TaskFlow — Intelligent Task Auto-Scheduler</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <!-- Matches the app's default (dark) --color-bg-page — ThemeContext
         updates this at runtime when the user switches theme, so the
         status bar/home-indicator strip always blends with the app instead
         of showing a fixed brand color that clashes with either theme. -->
    <meta name="theme-color" content="#1c1b17" />
    <!-- iOS ignores manifest.json's display mode — these are required
         separately for a home-screen-launched icon to run without Safari
         chrome (see public/manifest.json for the Android/Chrome equivalent). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TaskFlow" />
    <!-- PNG, not favicon.svg: iOS doesn't reliably rasterize an SVG here —
         it silently falls back to a generic/blank home-screen icon. Full
         bleed square (iOS applies its own rounded-corner mask; a
         pre-rounded source would show transparent corners under it). -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
